# NYC: Slice of Life — runs behind the shared gateway on /nyc-lyfe/.
#
# No host port binding. Attaches to the `gateway_nyc` network so the gateway
# Caddy can reach it by container name. Static-only — no backend server.
services:
  nyc-lyfe-web:
    image: ghcr.io/${GH_REPO}/web:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: nyc-lyfe-web
    restart: unless-stopped
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  gateway:
    name: gateway_nyc
    external: true
